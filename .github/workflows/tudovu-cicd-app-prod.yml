# .github/workflows/tudovu-cicd-app-prod.yml
name: Tudovu CI/CD App / Prod

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  build-test-secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── CloudFormation template lint ──
      #
      # Runs before the build because a template defect costs twenty minutes to discover through a
      # deploy and two seconds here. Honest about its reach: it will NOT catch every shape error —
      # an unsubstituted reference inside an Fn::Sub variable map is valid CloudFormation to a
      # linter and still rolls the stack back — so it is a floor, not a substitute for deploying.
      #
      # Fails on ERRORS only. cfn-lint is opinionated about stateful defaults, and a pipeline that
      # blocks on informational findings teaches people to ignore it.
      #
      # The version is PINNED. Unpinned, this step installs whatever released last night, so a new
      # rule can block every deployment in the fleet overnight for a template nobody touched. That
      # is not hypothetical: 1.55.1 added an ARN-format check that 1.46 did not have, and it failed
      # a template that had already deployed. Bumping this is a deliberate, reviewable act.
      - name: CloudFormation template lint
        run: |
          if ls infra/*.yaml >/dev/null 2>&1; then
            python -m pip install --quiet "cfn-lint==1.55.1"
            cfn-lint infra/*.yaml --non-zero-exit-code error
          else
            echo "No infra templates to lint."
          fi
      - name: Build application image
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build -t "app:$GIT_SHA" .
      - name: Fetch the Tudovu CLI (for the container smoke test)
        id: tudovu_cli
        continue-on-error: true
        run: npx --yes "@tudovu/cli@^0.3.2" --version
      - name: Container smoke test
        if: steps.tudovu_cli.outcome == 'success'
        env:
          GIT_SHA: ${{ github.sha }}
        run: npx --yes "@tudovu/cli@^0.3.2" preflight --image "app:$GIT_SHA" --port 3000 --health-path / --report smoke-report.json
      - name: Container smoke test skipped
        if: steps.tudovu_cli.outcome != 'success'
        run: echo "Could not fetch the Tudovu CLI, so the container smoke test did not run. This does not block the pipeline."
      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.json
          if-no-files-found: ignore
      - name: Detect CodeQL languages
        id: codeql_langs
        run: |
          LANGS=""
          if [ -f package.json ]; then LANGS="$LANGS,javascript-typescript"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Pipfile ]; then LANGS="$LANGS,python"; fi
          if [ -f go.mod ]; then LANGS="$LANGS,go"; fi
          echo "languages=${LANGS#,}" >> "$GITHUB_OUTPUT"
      - name: CodeQL init
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ steps.codeql_langs.outputs.languages }}
      - name: CodeQL autobuild
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/autobuild@v3
      - name: CodeQL analyze (SAST. Needs GitHub Advanced Security to publish results)
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
      # The scan writes a report; the step below decides what it means. Separated for the same
      # reason DAST is: a scanner that fails to run must never be indistinguishable from an
      # application that failed a check.
      - name: Semgrep policy scan (SAST)
        run: |
          python -m pip install --quiet 'semgrep==1.145.0'
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --json --output semgrep-results.json --quiet || true
          test -f semgrep-results.json || { echo "::error::Semgrep produced no report, so its result is unknown. Not treating that as a pass."; exit 1; }
      - name: Publish the SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.json
          if-no-files-found: ignore
      - name: Evaluate SAST findings
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python - <<'TUDOVU_SAST_GATE'
          import json, os, sys, datetime
          try:
              import yaml
          except ImportError:
              print("::error::PyYAML is missing, so accepted findings cannot be read. Failing rather than ignoring the file.")
              sys.exit(1)

          REPORT = "semgrep-results.json"
          ACCEPTED = ".semgrep-accepted.yaml"
          ORDER = ["INFO", "WARNING", "ERROR"]
          FLOOR = "ERROR"

          # A missing report is not a clean scan.
          if not os.path.exists(REPORT):
              print("::error::" + REPORT + " is missing, so the scan's result is unknown. Not treating that as a pass.")
              sys.exit(1)

          with open(REPORT) as fh:
              raw = json.load(fh)

          findings = []
          for r in raw.get("results") or []:
              rule = str(r.get("check_id", "")).strip()
              if not rule:
                  continue
              extra = r.get("extra") or {}
              sev = str(extra.get("severity", "WARNING")).upper()
              findings.append({
                  "rule": rule,
                  "path": str(r.get("path", "")).lstrip("./"),
                  "line": (r.get("start") or {}).get("line", 0),
                  "sev": sev if sev in ORDER else "WARNING",
                  "fp": extra.get("fingerprint"),
                  "msg": (extra.get("message") or "").strip(),
              })

          accepted, expired = [], []
          today = datetime.date.today().isoformat()
          if os.path.exists(ACCEPTED):
              doc = yaml.safe_load(open(ACCEPTED)) or {}
              for e in (doc.get("findings") or []):
                  rule, path = str(e.get("ruleId", "")).strip(), str(e.get("path", "")).strip()
                  exp = str(e.get("expiresAt", ""))
                  if not rule or not path:
                      # A path-less entry would accept the rule everywhere. Refused rather than honoured.
                      print("::warning::Ignoring an acceptance without both a ruleId and a path: " + str(e))
                      continue
                  (accepted if exp and exp >= today else expired).append(
                      {"rule": rule, "path": path, "fp": e.get("fingerprint"), "exp": exp, "reason": e.get("reason", "")}
                  )

          for e in expired:
              print("::warning::Acceptance for " + e["rule"] + " in " + e["path"] + " expired on " + str(e["exp"]) + ". It blocks again from now on.")

          def covered(f):
              for a in accepted:
                  if a["rule"] != f["rule"] or a["path"] != f["path"]:
                      continue
                  if a.get("fp"):
                      if a["fp"] == f.get("fp"):
                          return True
                      continue
                  return True
              return False

          blocking = [f for f in findings if ORDER.index(f["sev"]) >= ORDER.index(FLOOR) and not covered(f)]
          accepted_hits = [f for f in findings if covered(f)]

          print("SAST: " + str(len(findings)) + " finding(s), " + str(len(accepted_hits)) + " accepted, " + str(len(blocking)) + " blocking (threshold: " + FLOOR + " and above).")
          for f in sorted(findings, key=lambda x: (x["path"], x["line"])):
              state = "BLOCKING" if f in blocking else ("accepted" if covered(f) else "below threshold")
              print("  [" + f["sev"] + "] " + f["path"] + ":" + str(f["line"]) + " " + f["rule"] + " - " + state)

          # An acceptance matching nothing is a standing permission for code that is gone. Left alone it
          # eventually covers something new that lands in the same file.
          for a in accepted:
              if not any(a["rule"] == f["rule"] and a["path"] == f["path"] for f in findings):
                  print("::warning::The acceptance for " + a["rule"] + " in " + a["path"] + " no longer matches anything. Remove it.")

          if not blocking:
              sys.exit(0)

          print("::error::" + str(len(blocking)) + " SAST finding(s) are neither fixed nor accepted.")
          for f in blocking:
              print("::error::" + f["path"] + ":" + str(f["line"]) + " " + f["rule"] + " - " + f["msg"][:160])
          print("::error::Fix them, or record an expiring acceptance naming the rule AND the file. Accepting a")
          print("::error::rule without a file would also accept the next match, in code nobody has written yet.")
          sys.exit(1)

          TUDOVU_SAST_GATE

      - name: Unit tests
        run: |
          if [ -f package.json ]; then
            # Install before testing: a container build leaves the runner with no
            # node_modules, so the repo's test binary would not exist.
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
          elif [ -f go.mod ]; then
            go test ./...
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            if [ -f requirements.txt ]; then python -m pip install -r requirements.txt >/dev/null 2>&1 || true; fi
            python -m pip install pytest >/dev/null 2>&1 && pytest --no-header -q || echo "No pytest suite."
          else
            echo "No recognized test manifest. Skipping tests."
          fi
      - name: Ensure the accepted-findings file exists
        # .trivyignore.yaml records findings a human has accepted, each with an expiry Trivy
        # enforces itself. A repository that has accepted nothing has no reason to carry the file,
        # but TRIVY_IGNOREFILE is fatal when the path is missing — so create an empty one.
        #
        # always(), because the JSON-artifact scan below is also always(). Without it any earlier
        # failure skips this step, that scan still runs, and Trivy dies on "ignore file not found"
        # instead of reporting anything. Measured on Saleor: the image build failed, and the scan
        # that exists to explain why failed on a missing empty file.
        if: always()
        run: '[ -f .trivyignore.yaml ] || printf "vulnerabilities: []\n" > .trivyignore.yaml'
      - name: Trivy dependency scan (blocking)
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1
      - name: Trivy dependency scan (JSON artifact)
        if: always()
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: 0
      - name: Trivy base image scan (advisory, does not block)
        # Base image + OS packages + vendored packaging tooling. Not reachable from
        # any dependency manifest, so blocking on these would leave a diligent repo
        # permanently red. from your own Dockerfile.
        #
        # continue-on-error, not just exit-code: 0. Those are different things — exit-code
        # governs FINDINGS, while trivy itself exits non-zero when it cannot inspect the image
        # at all. Observed live: when the build step failed there was no image to scan, so a step
        # labelled "advisory, does not block" turned red and reported four transport errors. A
        # step that contradicts its own label is worse than no step.
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 0
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore

      # Deploy on main, only when a starter stack is present (the website path
      # ships infra/website.yaml + its own deploy workflow instead). Assumes the
      # foundation OIDC deploy role. Same role + region vars as the deploy workflow.
      - name: Configure AWS for deploy (OIDC)
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TUDOVU_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.TUDOVU_AWS_REGION || 'us-east-1' }}
      - name: Deploy CloudFormation stack
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
        run: aws cloudformation deploy --template-file infra/stack.yaml --stack-name "tudovu-$REPO_NAME-app" --capabilities CAPABILITY_IAM --region ${{ vars.TUDOVU_AWS_REGION || 'us-east-1' }} --tags "tudovu:repo=$REPO_FULL"
      - name: Roll out Amazon ECS
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        run: echo "Deployed Amazon ECS via CloudFormation after passing the security gates."
