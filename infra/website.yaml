AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Dynamic web app hosting for wiki.demodeployments.com (Tudovu). ECS
  Fargate service behind an HTTPS Application Load Balancer with an ACM cert and
  Route53 alias records. Review task sizing, health checks, and scaling.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The existing Route53 hosted zone for wiki.demodeployments.com.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to run the service + load balancer in.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets for the ALB and Fargate tasks.
  ImageUri:
    Type: String
    Description: ECR image URI the CI/CD workflow pushes (e.g. <acct>.dkr.ecr.<region>.amazonaws.com/app:<sha>).
  DesiredCount:
    Type: Number
    Default: 1

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress (443, and 80 to redirect) - public access.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks accept traffic only from the ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: wiki.demodeployments.com
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: wiki.demodeployments.com
          HostedZoneId: !Ref HostedZoneId

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      # A redirect is a healthy answer. Without this the default matcher accepts 200 alone, so an
      # app that redirects on / -- to a login page, a locale prefix, a setup wizard -- is killed by
      # the load balancer while serving correctly, and the service never stabilises. DVWA returns
      # 302 to login.php and looped forever on exactly this.
      Matcher:
        HttpCode: 200-399

  # Nobody types the scheme. Without this, a bare hostname reaches a port the ALB does not listen
  # on: the SYN is dropped and the browser spins until it times out, which is indistinguishable
  # from an outage. A 301 to HTTPS costs nothing and is what every client already expects.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS

      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/tudovu/${AWS::StackName}"
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TudovuArchitectBoundary'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres reachable only from the app tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnets for ${AWS::StackName} Postgres"
      SubnetIds: !Ref PublicSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: postgres
      DBName: appdb
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      MasterUsername: appuser
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      # 7 days is AC-RDS-004's floor; 1 failed Tudovu's own check.
      BackupRetentionPeriod: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
          Essential: true
          Environment:
            - { Name: POSTGRES_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: POSTGRES_PORT, Value: "5432" }
            - { Name: POSTGRES_DB, Value: appdb }
            - { Name: POSTGRES_USER, Value: appuser }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_SERVER, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: "5432" }
            - { Name: DB_NAME, Value: appdb }
            - { Name: DB_DATABASE, Value: appdb }
            - { Name: DB_USER, Value: appuser }
          Secrets:
            - { Name: POSTGRES_PASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
            - { Name: DB_PASS, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - Database
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # An app that cannot start must fail the deployment, not hang it.
      #
      # Without this, ECS retries a crash-looping task forever and CloudFormation sits in
      # CREATE_IN_PROGRESS for hours waiting for a service that will never stabilise -- and the
      # stack cannot be updated while it waits, so the fix cannot be deployed either. Every attempt
      # then costs a manual delete plus a full RDS teardown. Measured repeatedly here: a container
      # that could not reach its database held the stack for the better part of an hour with
      # nothing in the console saying why.
      #
      # The circuit breaker stops after a few failed placements and rolls back, so the failure
      # arrives in minutes with the task's own stopped reason attached.
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  AliasRecord0:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: wiki.demodeployments.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
