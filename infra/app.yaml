AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Container service (Tudovu). ECS Fargate behind an internet-facing
  Application Load Balancer (HTTP). Image from ECR. No custom domain — served on
  the ALB DNS name. Add a domain via the Website path for HTTPS + Route53.

# ── Variables your app reads that Tudovu could not supply ──────────────────────
# DB_TYPE
#
# These are intentionally NOT set on the container. Setting them to an empty string
# would be worse than leaving them alone: code like os.environ.setdefault(...) or
# process.env.X ?? default treats an empty value as "already configured" and skips
# its own default.
#
# Plain values: set the matching Env* parameter below.
# Credentials and connection strings: create a Secrets Manager secret and add it to
# the task definition's Secrets list — Tudovu will not invent a value, because a
# random string cannot authenticate to a third party or parse as a connection URL.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to run the service + load balancer in.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets for the ALB and Fargate tasks.
  ImageUri:
    Type: String
    Description: ECR image URI the CI/CD workflow pushes.
  CloudFrontPrefixListId:
    Type: String
    Description: >-
      AWS-managed com.amazonaws.global.cloudfront.origin-facing prefix list for this region.
      The load balancer accepts traffic only from these ranges, so it cannot be reached directly.
  DesiredCount:
    Type: Number
    Default: 2
  EnvDbType:
    Type: String
    Default: ""
    Description: Optional DB_TYPE for the app container. Injected only when non-empty.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: >-
      SNS topic ARN for alarm notifications. Leave blank and the alarms are still created and
      visible in CloudWatch, but notify nobody — wire this to your own topic (Slack via AWS
      Chatbot, or PagerDuty's SNS integration).
  EnableDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Block accidental deletion of the database. Off by default so a stack can be torn down
      cleanly; turn it on for anything holding data you cannot lose.

Conditions:
  HasEnvDbType: !Not [!Equals [!Ref EnvDbType, ""]]
  HasAlarmTopicArn: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress (HTTP 80) - CloudFront origins only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing ranges only - direct access to this load balancer is closed.

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks accept traffic only from the ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-399

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/tudovu/${AWS::StackName}"
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TudovuArchitectBoundary'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref DbUrlSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TudovuArchitectBoundary'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AppBucket.Arn
                  - !Sub "${AppBucket.Arn}/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
          Essential: true
          Environment:
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: POSTGRES_DB
              Value: "appdb"
            - Name: POSTGRES_USER
              Value: "appuser"
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_SERVER
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: "appdb"
            - Name: DB_DATABASE
              Value: "appdb"
            - Name: DB_USER
              Value: "appuser"
            - Name: APP_BUCKET
              Value: !Ref AppBucket
            - !If
              - HasEnvDbType
              - Name: DB_TYPE
                Value: !Ref EnvDbType
              - !Ref "AWS::NoValue"
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DbSecret}:password::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DbSecret}:password::"
            - Name: DB_PASS
              ValueFrom: !Sub "${DbSecret}:password::"
            - Name: DATABASE_URL
              ValueFrom: !Ref DbUrlSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      # An app that cannot start must fail the deployment, not hang it.
      #
      # Without this, ECS retries a crash-looping task forever and CloudFormation sits in
      # CREATE_IN_PROGRESS for hours waiting for a service that will never stabilise -- and the
      # stack cannot be updated while it waits, so the fix cannot be deployed either. Every attempt
      # then costs a manual delete plus a full RDS teardown. Measured repeatedly here: a container
      # that could not reach its database held the stack for the better part of an hour with
      # nothing in the console saying why.
      #
      # The circuit breaker stops after a few failed placements and rolls back, so the failure
      # arrives in minutes with the task's own stopped reason attached.
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "DB credentials for ${AWS::StackName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"appuser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  DbUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${AWS::StackName} — full connection URL, for apps that read one variable"
      # ONE !Sub template string, not the list form with a variable map.
      #
      # The map form looks tidier and is silently wrong: !Sub substitutes only its TEMPLATE, never
      # the map's values, so a "{{resolve:secretsmanager:${DbSecret}:...}}" written there keeps a
      # literal ${DbSecret} and CloudFormation goes looking for a secret by that name — "Invalid
      # name. Must be a valid name containing alphanumeric characters..." because $ { } are not
      # legal in one. Measured: it rolled back the whole Saleor stack.
      #
      # This is the shape MasterUserPassword above already uses and that has always worked.
      SecretString: !Sub "postgresql://appuser:{{resolve:secretsmanager:${DbSecret}:SecretString:password}}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/appdb"

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnets for ${AWS::StackName} database"
      SubnetIds: !Ref PublicSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database accepts traffic only from the app tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      DBName: appdb
      MasterUsername: appuser
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      # ── Transport security is INHERITED from the engine's default parameter group ──
      #
      # No DBParameterGroupName is set, so this instance takes the engine default — and that
      # default differs by engine. Measured on this same template an hour apart: MySQL 8.4.9
      # accepted a plain connection; default.mariadb11.8 ships require_secure_transport=1 and
      # refused one ("Connections using insecure transport are prohibited"). Both stacks reached
      # CREATE_COMPLETE with every target healthy — only the application could tell them apart.
      #
      # Postgres, the DEFAULT engine, is in the requires-TLS camp too: default.postgres18 ships
      # rds.force_ssl=1, and it reports the refusal as SQLSTATE 28000 — an authorization error that
      # reads exactly like a wrong password. Measured on this template with Wiki.js, which retried
      # ten times against a database that was never going to accept it. So the common case is
      # "TLS required", not the exception the MariaDB note originally implied.
      #
      # Pinning it here would mean pinning EngineVersion too (a parameter group needs a Family such
      # as mariadb11.8), which trades this surprise for a version table that goes stale. So the
      # posture is left to AWS and STATED instead — see the database section of the pull request.
      # If your app connects in the clear and the engine requires TLS, give it the RDS CA bundle
      # rather than turning the requirement off.
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      BackupRetentionPeriod: 30
      DeletionProtection: !Ref EnableDeletionProtection

  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all

  ServiceCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ECS service CPU utilization is high.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: !If [HasAlarmTopicArn, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]
      OKActions: !If [HasAlarmTopicArn, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ALB is returning 5xx errors.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopicArn, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]
      OKActions: !If [HasAlarmTopicArn, [!Ref AlarmTopicArn], !Ref "AWS::NoValue"]

Outputs:
  AppUrl:
    Description: App URL (ALB DNS). Add a custom domain via the Website path for HTTPS.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  CdnUrl:
    Description: HTTPS URL served by CloudFront (edge TLS, no custom domain needed).
    Value: !Sub "https://${Distribution.DomainName}"
  DatabaseEndpoint:
    Description: RDS endpoint the app connects to.
    Value: !GetAtt Database.Endpoint.Address
